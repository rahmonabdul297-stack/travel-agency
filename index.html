<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Excellent Travel Agency — A Reliable Way Towards a Brighter Future</title>
    <meta name="title" content="Excellent Travel Agency — A Reliable Way Towards a Brighter Future" />
    <meta name="description" content="Professional travel and pilgrimage agency offering domestic & international flight tickets, hotel reservations, 14/21/28-day Umrah packages, and Turkey & China student visa services." />
    <meta name="keywords" content="Excellent Travel Agency, Umrah Packages, Flight Tickets, Hotel Reservations, Turkey Student Visa, China Student Visa, Makkah Madinah Pilgrimage, Travel Agency" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Excellent Travel Agency" />
    <link rel="canonical" href="https://travel-agency-tawny-three.vercel.app" />

    <!-- Favicon & Theme Color -->
    <link rel="icon" type="image/svg+xml" href="/images/logo2.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FF5E36" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0F19" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://travel-agency-tawny-three.vercel.app" />
    <meta property="og:title" content="Excellent Travel Agency — A Reliable Way Towards a Brighter Future" />
    <meta property="og:description" content="Reliable and convenient travel services: Flights, Hotels, Umrah Pilgrimage Packages, and Student Visas for Turkey & China." />
    <meta property="og:image" content="https://travel-agency-tawny-three.vercel.app/images/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://travel-agency-tawny-three.vercel.app/images/logo.png" />
    <meta name="twitter:title" content="Excellent Travel Agency — A Reliable Way Towards a Brighter Future" />
    <meta name="twitter:description" content="Reliable and convenient travel services: Flights, Hotels, Umrah Pilgrimage Packages, and Student Visas for Turkey & China." />
    <meta name="twitter:image" content="https://travel-agency-tawny-three.vercel.app/images/logo.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Excellent Travel Agency",
        "image": "https://travel-agency-tawny-three.vercel.app/images/logo.png",
        "description": "Professional travel and pilgrimage agency providing flight tickets, hotel bookings, Umrah packages, and student visa services.",
        "slogan": "A Reliable Way Towards a Brighter Future",
        "url": "https://travel-agency-tawny-three.vercel.app",
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Domestic & International Flight Tickets" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hotel Reservations" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Umrah Visa & Packages (14, 21, 28 Days)" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Turkey & China Student Visas" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
